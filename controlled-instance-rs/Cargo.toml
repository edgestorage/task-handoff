[workspace]
members = [
  "crates/protocol",
  "crates/core",
  "crates/ai-session",
  "crates/app-runtime",
  "crates/workspace",
  "crates/instance",
  "crates/cli",
  "crates/test-support",
]
resolver = "2"

[workspace.package]
version = "0.0.46"
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
bson = "2.15"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
http = "1.3"
http-body-util = "0.1"
icu_collator = "2.4"
icu_locale_core = "2.4"
jsonschema = { version = "0.60", default-features = false }
libc = "0.2"
mime_guess = "2.0"
notify = "8.2"
percent-encoding = "2.3"
picomatch-rs = "0.1"
rand = "0.9"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
subtle = "2.6"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "set-header"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
avt = "0.19"

# Keep local/CI target size bounded. Full debug info for every dependency and
# crate made target/debug exceed 50 GiB and filled the host disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
