[workspace]
members = ["crates/protocol", "crates/desktop-streaming"]
resolver = "2"

[workspace.package]
version = "0.0.46"
edition = "2021"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
bytes = "1.10"
futures-util = "0.3"
libc = "0.2"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
