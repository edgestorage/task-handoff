[package]
name = "desktop-streaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
remote-desktop-protocol = { path = "../protocol" }
anyhow.workspace = true
async-trait.workspace = true
controlled-instance-core = { path = "../../../controlled-instance-rs/crates/core" }
controlled-instance-protocol = { path = "../../../controlled-instance-rs/crates/protocol" }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tempfile.workspace = true
bytes.workspace = true
futures-util.workspace = true
axum.workspace = true
openh264 = "=0.9.9"
webrtc = "=0.21.1"
rtc = "=0.21.1"
enigo = "=0.6.1"
keycode = "=1.0.0"
fast_image_resize = "=6.1.0"
yuv = "=0.8.20"
arboard = { version = "=3.6.1", default-features = false }

[dev-dependencies]
desktop-component-host = { path = "../../../controlled-instance-rs/crates/desktop-component-host" }
tokio-tungstenite.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.14.0", features = ["shm", "damage", "xfixes", "xtest", "randr", "composite", "allow-unsafe-code"] }
libc.workspace = true
shlex = "=2.0.1"

[target.'cfg(target_os = "windows")'.dependencies.crabgrab]
version = "=0.4.0"
features = ["bitmap"]

[[bin]]
name = "task-handoff-desktop-streaming"
path = "src/bin/component.rs"

[[bin]]
name = "desktop-test-host"
path = "src/bin/test_host.rs"

[[bin]]
name = "desktop-x11-fixture"
path = "src/bin/x11_fixture.rs"

[[bin]]
name = "desktop-x11-gui-fixture"
path = "src/bin/x11_gui_fixture.rs"

[[bin]]
name = "desktop-encoder-probe"
path = "src/bin/encoder_probe.rs"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "=11.1.2"
videotoolbox = { version = "=0.21.2", features = ["async"] }
apple-cf = { version = "=0.11.7", default-features = false, features = ["cv", "cm", "iosurface"] }
crc32fast = "=1.5.4"
futures-executor = "=0.3.34"
core-graphics = "=0.25.0"
core-foundation = "=0.10.1"
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGWindowLevel"] }
objc2-core-foundation = { version = "=0.3.2", features = ["CFCGTypes"] }
objc2-application-services = { version = "=0.3.2", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement", "AXValue", "AXError"] }
objc2 = { version = "=0.6.5", default-features = false }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSEvent", "NSScreen"] }

[[bin]]
name = "desktop-native-probe"
path = "src/bin/native_probe.rs"

[[bin]]
name = "desktop-input-probe"
path = "src/bin/input_probe.rs"

[[bin]]
name = "desktop-videotoolbox-probe"
path = "src/bin/videotoolbox_probe.rs"

[features]
vaapi = ["dep:cros-codecs", "dep:cros-libva"]

[target.'cfg(target_os = "linux")'.dependencies.cros-codecs]
version = "=0.0.6"
features = ["vaapi"]
optional = true

[target.'cfg(target_os = "linux")'.dependencies.cros-libva]
version = "=0.0.12"
optional = true

[[bin]]
name = "desktop-vaapi-encoder"
path = "src/bin/vaapi_encoder.rs"
required-features = ["vaapi"]

[[bin]]
name = "desktop-automatic-encoder-probe"
path = "src/bin/automatic_encoder_probe.rs"
