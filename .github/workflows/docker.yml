name: Docker

on:
  pull_request:
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "test/**"
      - "scripts/docker-build-image.sh"
  push:
    tags:
      - "docker-v*"
  workflow_dispatch:
    inputs:
      image_version:
        description: "Docker image release version without the docker-v prefix (for example 1.0.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_CODEX_IMAGE_NAME: ${{ vars.DOCKERHUB_CODEX_IMAGE_NAME || 'task-handoff-controlled-codex' }}
  DOCKERHUB_OPENCODE_IMAGE_NAME: ${{ vars.DOCKERHUB_OPENCODE_IMAGE_NAME || 'task-handoff-controlled-opencode' }}
  DOCKERHUB_AI_IMAGE_NAME: ${{ vars.DOCKERHUB_AI_IMAGE_NAME || 'task-handoff-controlled-ai' }}
  DOCKERHUB_WEBCAP_IMAGE_NAME: ${{ vars.DOCKERHUB_WEBCAP_IMAGE_NAME || 'task-handoff-controlled-webcap' }}
  DOCKERHUB_BROWSER_IMAGE_NAME: ${{ vars.DOCKERHUB_BROWSER_IMAGE_NAME || 'task-handoff-controlled-browser' }}

jobs:
  docker-build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image version
        id: image-version
        env:
          REQUESTED_IMAGE_VERSION: ${{ inputs.image_version }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/docker-v* ]]; then
            version="${GITHUB_REF_NAME#docker-v}"
            node -e 'if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.argv[1])) process.exit(1)' "$version"
            tag="docker-v${version}"
          elif [[ -n "${REQUESTED_IMAGE_VERSION}" ]]; then
            version="${REQUESTED_IMAGE_VERSION}"
            node -e 'if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.argv[1])) process.exit(1)' "$version"
            tag="docker-v${version}"
          else
            version="ci-${GITHUB_SHA::7}"
            tag="ci-${GITHUB_SHA::7}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "codex-image-ref=${DOCKERHUB_CODEX_IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "opencode-image-ref=${DOCKERHUB_OPENCODE_IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "ai-image-ref=${DOCKERHUB_AI_IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "webcap-image-ref=${DOCKERHUB_WEBCAP_IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "browser-image-ref=${DOCKERHUB_BROWSER_IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build Codex image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          target: profile-codex
          tags: task-handoff-controlled-codex:ci-${{ matrix.arch }}
          build-args: |
            TASK_HANDOFF_IMAGE_VERSION=${{ steps.image-version.outputs.value }}
            TASK_HANDOFF_BUILD_ID=${{ github.run_id }}
            TASK_HANDOFF_BUILT_AT=${{ github.event.repository.updated_at }}
            TASK_HANDOFF_GIT_COMMIT=${{ github.sha }}
            TASK_HANDOFF_IMAGE_REF=${{ steps.image-version.outputs.codex-image-ref }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.arch }}

      - name: Build OpenCode image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          target: profile-opencode
          tags: task-handoff-controlled-opencode:ci-${{ matrix.arch }}
          build-args: |
            TASK_HANDOFF_IMAGE_VERSION=${{ steps.image-version.outputs.value }}
            TASK_HANDOFF_BUILD_ID=${{ github.run_id }}
            TASK_HANDOFF_BUILT_AT=${{ github.event.repository.updated_at }}
            TASK_HANDOFF_GIT_COMMIT=${{ github.sha }}
            TASK_HANDOFF_IMAGE_REF=${{ steps.image-version.outputs.opencode-image-ref }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.arch }}

      - name: Build AI image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          target: profile-ai
          tags: task-handoff-controlled-ai:ci-${{ matrix.arch }}
          build-args: |
            TASK_HANDOFF_IMAGE_VERSION=${{ steps.image-version.outputs.value }}
            TASK_HANDOFF_BUILD_ID=${{ github.run_id }}
            TASK_HANDOFF_BUILT_AT=${{ github.event.repository.updated_at }}
            TASK_HANDOFF_GIT_COMMIT=${{ github.sha }}
            TASK_HANDOFF_IMAGE_REF=${{ steps.image-version.outputs.ai-image-ref }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.arch }}

      - name: Build WebCap image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          target: profile-webcap
          tags: task-handoff-controlled-webcap:ci-${{ matrix.arch }}
          build-args: |
            TASK_HANDOFF_IMAGE_VERSION=${{ steps.image-version.outputs.value }}
            TASK_HANDOFF_BUILD_ID=${{ github.run_id }}
            TASK_HANDOFF_BUILT_AT=${{ github.event.repository.updated_at }}
            TASK_HANDOFF_GIT_COMMIT=${{ github.sha }}
            TASK_HANDOFF_IMAGE_REF=${{ steps.image-version.outputs.webcap-image-ref }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.arch }}

      - name: Build Browser image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          target: profile-browser
          tags: task-handoff-controlled-browser:ci-${{ matrix.arch }}
          build-args: |
            TASK_HANDOFF_IMAGE_VERSION=${{ steps.image-version.outputs.value }}
            TASK_HANDOFF_BUILD_ID=${{ github.run_id }}
            TASK_HANDOFF_BUILT_AT=${{ github.event.repository.updated_at }}
            TASK_HANDOFF_GIT_COMMIT=${{ github.sha }}
            TASK_HANDOFF_IMAGE_REF=${{ steps.image-version.outputs.browser-image-ref }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.arch }}

      - name: Verify image metadata and controlled-instance absence
        env:
          EXPECTED_VERSION: ${{ steps.image-version.outputs.value }}
        run: |
          set -euo pipefail
          for profile in codex opencode ai webcap browser; do
            image="task-handoff-controlled-${profile}:ci-${{ matrix.arch }}"
            actual="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            declared_profile="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.task-handoff.image.profile" }}')"
            test "$actual" = "$EXPECTED_VERSION"
            test "$declared_profile" = "$profile"
          done

      - name: Smoke test profile environments without embedded runtime
        if: ${{ matrix.arch == 'amd64' }}
        shell: bash
        run: |
          set -euo pipefail
          containers=()
          cleanup() {
            if ((${#containers[@]})); then docker rm -f "${containers[@]}" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT

          run_profile() {
            local profile="$1"
            shift
            local name="task-handoff-${profile}-ci"
            containers+=("$name")
            docker run -d --name "$name" "task-handoff-controlled-${profile}:ci-amd64" >/dev/null
            for i in $(seq 1 30); do
              state="$(docker inspect --format '{{.State.Running}}' "$name" 2>/dev/null || true)"
              if [ "$state" = true ] && docker logs "$name" 2>&1 | grep -q 'No controlled-instance runtime is active'; then
                break
              fi
              if [ "$i" = 30 ]; then docker logs "$name"; exit 1; fi
              sleep 1
            done
            test "$(docker exec "$name" id -un)" = agent
            test "$(docker exec "$name" sudo -n id -u)" = 0
            test "$(docker exec "$name" sh -lc 'test ! -e /usr/local/bin/task-handoff-controlled-instance && echo absent')" = absent
            test "$(docker exec "$name" sh -lc 'test ! -e /usr/local/lib/node_modules/@task-handoff/controlled-instance && echo absent')" = absent
            for command in "$@"; do docker exec "$name" sh -lc "command -v '$command'" >/dev/null; done
          }

          run_profile codex codex
          run_profile opencode opencode
          run_profile ai codex claude
          run_profile webcap codex claude chromium vncserver web-cap
          run_profile browser codex claude chromium vncserver code-server

          ! docker exec task-handoff-codex-ci sh -lc 'command -v claude'
          ! docker exec task-handoff-codex-ci sh -lc 'command -v chromium'
          ! docker exec task-handoff-opencode-ci sh -lc 'command -v codex'
          ! docker exec task-handoff-opencode-ci sh -lc 'command -v claude'
          ! docker exec task-handoff-ai-ci sh -lc 'command -v chromium'
          ! docker exec task-handoff-webcap-ci sh -lc 'command -v code-server'
          ! docker exec task-handoff-browser-ci sh -lc 'command -v web-cap'

      - name: Cleanup
        if: ${{ always() && matrix.arch == 'amd64' }}
        run: docker rm -f task-handoff-codex-ci task-handoff-opencode-ci task-handoff-ai-ci task-handoff-webcap-ci task-handoff-browser-ci 2>/dev/null || true

      - name: Login to Docker Hub
        if: ${{ startsWith(github.ref, 'refs/tags/docker-v') || inputs.image_version != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish immutable commit image
        if: ${{ startsWith(github.ref, 'refs/tags/docker-v') || inputs.image_version != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          sha_tag="docker-sha-${GITHUB_SHA::7}-${{ matrix.arch }}"
          for entry in \
            "codex:${DOCKERHUB_CODEX_IMAGE_NAME}" \
            "opencode:${DOCKERHUB_OPENCODE_IMAGE_NAME}" \
            "ai:${DOCKERHUB_AI_IMAGE_NAME}" \
            "webcap:${DOCKERHUB_WEBCAP_IMAGE_NAME}" \
            "browser:${DOCKERHUB_BROWSER_IMAGE_NAME}"
          do
            profile="${entry%%:*}"
            image_name="${entry#*:}"
            image="${DOCKERHUB_USERNAME}/${image_name}"
            docker tag "task-handoff-controlled-${profile}:ci-${{ matrix.arch }}" "${image}:${sha_tag}"
            docker push "${image}:${sha_tag}"
          done

  publish-multiarch-image:
    if: ${{ startsWith(github.ref, 'refs/tags/docker-v') || inputs.image_version != '' }}
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture commit image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          sha_tag="docker-sha-${GITHUB_SHA::7}"
          for image_name in \
            "${DOCKERHUB_CODEX_IMAGE_NAME}" \
            "${DOCKERHUB_OPENCODE_IMAGE_NAME}" \
            "${DOCKERHUB_AI_IMAGE_NAME}" \
            "${DOCKERHUB_WEBCAP_IMAGE_NAME}" \
            "${DOCKERHUB_BROWSER_IMAGE_NAME}"
          do
            image="${DOCKERHUB_USERNAME}/${image_name}"
            docker buildx imagetools create \
              --tag "${image}:${sha_tag}" \
              "${image}:${sha_tag}-amd64" \
              "${image}:${sha_tag}-arm64"
            docker buildx imagetools inspect "${image}:${sha_tag}"
          done

  promote-release:
    if: ${{ startsWith(github.ref, 'refs/tags/docker-v') || inputs.image_version != '' }}
    needs: publish-multiarch-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote immutable image to Docker release tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REQUESTED_IMAGE_VERSION: ${{ inputs.image_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/docker-v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="docker-v${REQUESTED_IMAGE_VERSION}"
          fi
          if [[ ! "$version" =~ ^docker-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Docker release tag is not a supported semantic version: $version"
            exit 1
          fi

          release_version="${version#docker-v}"
          if [[ "$release_version" == *-* ]]; then
            prerelease="${release_version#*-}"
            channel="${prerelease%%.*}"
            if [[ "$channel" != "alpha" && "$channel" != "beta" ]]; then
              echo "::error::Only alpha and beta Docker prerelease channels are supported: $version"
              exit 1
            fi
          fi

          for image_name in \
            "${DOCKERHUB_CODEX_IMAGE_NAME}" \
            "${DOCKERHUB_OPENCODE_IMAGE_NAME}" \
            "${DOCKERHUB_AI_IMAGE_NAME}" \
            "${DOCKERHUB_WEBCAP_IMAGE_NAME}" \
            "${DOCKERHUB_BROWSER_IMAGE_NAME}"
          do
            image="${DOCKERHUB_USERNAME}/${image_name}"
            source="${image}:docker-sha-${GITHUB_SHA::7}"
            tags=(--tag "${image}:${version}")
            if [[ "$release_version" != *-* ]]; then
              tags+=(--tag "${image}:latest")
            else
              tags+=(--tag "${image}:${channel}")
            fi
            docker buildx imagetools create --prefer-index=false "${tags[@]}" "$source"
            docker buildx imagetools inspect "${image}:${version}"
          done
