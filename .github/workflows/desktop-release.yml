name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-pty-prebuilds:
    name: node-pty prebuild (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and collect Linux node-pty prebuild on the glibc baseline
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            node:24-bullseye \
            bash -lc 'set -euo pipefail; cd node_modules/node-pty; rm -rf build; npm_config_nodedir=/usr/local node /usr/local/lib/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js rebuild; cd /workspace; node scripts/node-pty-prebuild.mjs build --output release/node-pty-prebuilds --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"'

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-node-pty-prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/node-pty-prebuilds/*
          if-no-files-found: error

  controlled-instance-artifact:
    name: Linux controlled instance artifact
    needs: node-pty-prebuilds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          node -e 'if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.argv[1])) process.exit(1)' "$version"
          node -e 'const p=process.argv[1].split("-")[1]; if (p && !/^(?:alpha|beta)\./.test(p)) process.exit(1)' "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-node-pty-prebuild-*
          path: release/node-pty-prebuilds
          merge-multiple: true

      - name: Build Linux controlled instance production runtime
        shell: bash
        env:
          TASK_HANDOFF_VERSION: ${{ steps.version.outputs.value }}
        run: |
          pnpm runtime:build -- --target controlled-instance
          pnpm runtime:artifact -- --version "$TASK_HANDOFF_VERSION" --prebuilds-dir release/node-pty-prebuilds

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-controlled-instance-runtime-${{ steps.version.outputs.value }}
          path: release/runtime-artifacts/*
          if-no-files-found: error

  build:
    name: Build ${{ matrix.platform }}
    needs: controlled-instance-artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64-x64
            os: macos-latest
            target: mac
            arch_args: --arm64 --x64
          - platform: windows-x64
            os: windows-latest
            target: win
            arch_args: --x64
          - platform: linux-x64
            os: ubuntu-latest
            target: linux
            arch_args: --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          node -e 'if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.argv[1])) process.exit(1)' "$version"
          node -e 'const p=process.argv[1].split("-")[1]; if (p && !/^(?:alpha|beta)\./.test(p)) process.exit(1)' "$version"
          channel="latest"
          if [[ "$version" == *-* ]]; then
            channel="${version#*-}"
            channel="${channel%%.*}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Configure macOS signing and notarization
        if: matrix.target == 'mac'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          APPLE_API_KEY="$key_path" node -e 'require("node:fs").writeFileSync(process.env.APPLE_API_KEY, Buffer.from(process.env.APPLE_API_KEY_P8, "base64"))'
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v7
        with:
          name: desktop-controlled-instance-runtime-${{ needs.controlled-instance-artifact.outputs.version }}
          path: release/runtime-artifacts

      - run: pnpm desktop:prepare
        env:
          TASK_HANDOFF_VERSION: ${{ steps.version.outputs.value }}

      - name: Build signed and notarized macOS installer
        if: matrix.target == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm exec electron-builder --${{ matrix.target }} ${{ matrix.arch_args }} --publish never --config.extraMetadata.version=${{ steps.version.outputs.value }} --config.publish.channel=${{ steps.version.outputs.channel }}

      - name: Verify macOS signing and notarization
        if: matrix.target == 'mac'
        shell: bash
        run: |
          set -- release/mac*/TaskHandoff.app
          if [[ "$#" -ne 2 || ! -d "$1" || ! -d "$2" ]]; then
            echo "::error::Expected signed arm64 and x64 TaskHandoff.app bundles"
            exit 1
          fi
          for app_path in "$@"; do
            codesign --verify --deep --strict --verbose=2 "$app_path"
            xcrun stapler validate "$app_path"
            spctl --assess --type execute --verbose=4 "$app_path"
          done

      - name: Build unsigned Windows or Linux installer
        if: matrix.target != 'mac'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --${{ matrix.target }} ${{ matrix.arch_args }} --publish never --config.extraMetadata.version=${{ steps.version.outputs.value }} --config.publish.channel=${{ steps.version.outputs.channel }}

      - name: Remove App Store Connect API key
        if: always() && matrix.target == 'mac'
        shell: bash
        run: rm -f "$APPLE_API_KEY"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
            release/latest-linux.yml
            release/beta.yml
            release/beta-mac.yml
            release/beta-linux.yml
            release/alpha.yml
            release/alpha-mac.yml
            release/alpha-linux.yml

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true

      - name: Compose user-facing release notes
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN || github.token }}
          GH_REPO: edgestorage/task-handoff
        shell: bash
        run: |
          gh api --method POST "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq '.body' > generated-release-notes.md

          append_installers() {
            local extension="$1"
            local platform="$2"
            local format="$3"
            local file name architecture url
            for file in release-artifacts/*."$extension"; do
              [[ -e "$file" ]] || continue
              name="${file##*/}"
              architecture="x64"
              if [[ "$name" == *-arm64.* ]]; then
                architecture="Apple Silicon"
              elif [[ "$name" == *-x64.* && "$platform" == "macOS" ]]; then
                architecture="Intel"
              fi
              url="https://github.com/${GH_REPO}/releases/download/${GITHUB_REF_NAME}/${name}"
              printf '| %s | %s | [%s](%s) |\n' "$platform" "$architecture" "$format" "$url"
            done
          }

          {
            echo "## Download TaskHandoff ${GITHUB_REF_NAME#v}"
            echo
            echo '| Platform | Architecture | Installer |'
            echo '| --- | --- | --- |'
            append_installers dmg macOS DMG
            append_installers exe Windows Installer
            append_installers AppImage Linux AppImage
            append_installers deb Linux DEB
            echo
            echo '> Windows builds are currently unsigned. macOS builds are signed and notarized.'
            echo
            echo '<details>'
            echo '<summary>Automatic update files</summary>'
            echo
            echo 'The Assets section also contains update manifests, blockmaps, and updater archives consumed automatically by the desktop application.'
            echo
            echo '</details>'
            echo
            cat generated-release-notes.md
          } > release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN || github.token }}
          GH_REPO: edgestorage/task-handoff
        run: |
          prerelease_flag=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_flag+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              gh release edit "$GITHUB_REF_NAME" --prerelease --notes-file release-notes.md
            else
              gh release edit "$GITHUB_REF_NAME" --prerelease=false --notes-file release-notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --notes-file release-notes.md --title "TaskHandoff $GITHUB_REF_NAME" "${prerelease_flag[@]}"
          fi

      - name: Verify published update manifests
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN || github.token }}
          GH_REPO: edgestorage/task-handoff
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          version="${GITHUB_REF_NAME#v}"
          channel="latest"
          if [[ "$version" == *-* ]]; then
            channel="${version#*-}"
            channel="${channel%%.*}"
          fi
          for pattern in '.+\.blockmap$' "^${channel}\\.yml$" "^${channel}-mac\\.yml$" "^${channel}-linux\\.yml$"; do
            if ! grep -Eq "$pattern" <<<"$assets"; then
              echo "::error::Published release is missing an update asset matching $pattern"
              exit 1
            fi
          done
