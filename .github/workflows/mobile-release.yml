name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing mobile-v* tag to publish
        required: true
        type: string
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify mobile release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve release version from tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^mobile-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Mobile release tag must use mobile-v<major>.<minor>.<patch> without a prerelease suffix, got: $tag"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag does not exist in the repository: $tag"
            exit 1
          fi
          version="${tag#mobile-v}"
          node apps/mobile/scripts/set-release-version.mjs "$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate production Expo configuration
        env:
          TASK_HANDOFF_MOBILE_VARIANT: production
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        working-directory: apps/mobile
        shell: bash
        run: |
          config="$(pnpm exec expo config --type public --json)"
          node -e '
            const config = JSON.parse(process.argv[1]);
            if (config.name !== "TaskHandoff") throw new Error(`Unexpected app name: ${config.name}`);
            if (config.version !== process.env.RELEASE_VERSION) {
              throw new Error(`Expo version ${config.version} does not match tag version ${process.env.RELEASE_VERSION}.`);
            }
            if (config.ios?.bundleIdentifier !== "com.taskhandoff.mobile") {
              throw new Error(`Unexpected iOS bundle identifier: ${config.ios?.bundleIdentifier}`);
            }
            if (config.android?.package !== "com.taskhandoff.mobile") {
              throw new Error(`Unexpected Android package: ${config.android?.package}`);
            }
          ' "$config"

      - run: pnpm --filter @task-handoff/mobile release:check
        env:
          TASK_HANDOFF_MOBILE_VARIANT: production

  android:
    name: Publish Android APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Apply tag version to Expo configuration
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: node apps/mobile/scripts/set-release-version.mjs "$RELEASE_VERSION"

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - run: pnpm install --frozen-lockfile

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TASK_HANDOFF_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TASK_HANDOFF_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TASK_HANDOFF_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 TASK_HANDOFF_ANDROID_KEYSTORE_PASSWORD TASK_HANDOFF_ANDROID_KEY_ALIAS TASK_HANDOFF_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required android-production secret: $name"
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/taskhandoff-android-release.jks"
          ANDROID_KEYSTORE_PATH="$keystore_path" node -e 'require("node:fs").writeFileSync(process.env.ANDROID_KEYSTORE_PATH, Buffer.from(process.env.ANDROID_KEYSTORE_BASE64, "base64"))'
          chmod 600 "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$TASK_HANDOFF_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$TASK_HANDOFF_ANDROID_KEY_ALIAS" >/dev/null
          echo "TASK_HANDOFF_ANDROID_KEYSTORE=$keystore_path" >> "$GITHUB_ENV"

      - name: Generate production Android project
        working-directory: apps/mobile
        env:
          TASK_HANDOFF_MOBILE_VARIANT: production
        run: pnpm exec expo prebuild --clean --platform android --no-install

      - name: Build signed Android production APK
        id: android
        env:
          TASK_HANDOFF_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TASK_HANDOFF_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TASK_HANDOFF_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.verify.outputs.version }}
        working-directory: apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon -PtaskHandoffVersionCode="$GITHUB_RUN_NUMBER"
          built_apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          if [[ -z "$built_apk" ]]; then
            echo "::error::Gradle produced no release APK"
            exit 1
          fi
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::Android SDK contains no apksigner"
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs "$built_apk"
          artifact="$RUNNER_TEMP/TaskHandoff-$VERSION-android.apk"
          cp "$built_apk" "$artifact"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Publish Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          ARTIFACT: ${{ steps.android.outputs.artifact }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARTIFACT" --clobber
          else
            gh release create "$RELEASE_TAG" "$ARTIFACT" \
              --verify-tag \
              --generate-notes \
              --title "TaskHandoff Mobile $VERSION"
          fi

      - name: Remove temporary Android signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/taskhandoff-android-release.jks"

  ios:
    name: Submit iOS to App Store Connect
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 90
    environment: ios-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Apply tag version to Expo configuration
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: node apps/mobile/scripts/set-release-version.mjs "$RELEASE_VERSION"

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate Xcode version
        shell: bash
        run: |
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          node -e '
            const [major, minor = 0] = process.argv[1].split(".").map(Number);
            if (major < 26 || (major === 26 && minor < 4)) {
              throw new Error(`Expo SDK 57 requires Xcode 26.4 or newer; runner has ${process.argv[1]}.`);
            }
          ' "$xcode_version"

      - name: Generate production iOS project
        working-directory: apps/mobile
        env:
          TASK_HANDOFF_MOBILE_VARIANT: production
        run: pnpm exec expo prebuild --clean --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      - name: Configure iOS signing
        id: signing
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_PROVISIONING_PROFILE: ${{ secrets.IOS_APP_PROVISIONING_PROFILE }}
          IOS_WIDGET_PROVISIONING_PROFILE: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID IOS_DISTRIBUTION_CERTIFICATE_P12 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_APP_PROVISIONING_PROFILE IOS_WIDGET_PROVISIONING_PROFILE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret or variable: $name"
              exit 1
            fi
          done

          keychain_path="$RUNNER_TEMP/taskhandoff-ios-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate_path="$RUNNER_TEMP/taskhandoff-ios-distribution.p12"
          app_profile_path="$RUNNER_TEMP/taskhandoff-app.mobileprovision"
          widget_profile_path="$RUNNER_TEMP/taskhandoff-widget.mobileprovision"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

          IOS_CERTIFICATE_PATH="$certificate_path" node -e 'require("node:fs").writeFileSync(process.env.IOS_CERTIFICATE_PATH, Buffer.from(process.env.IOS_DISTRIBUTION_CERTIFICATE_P12, "base64"))'
          IOS_APP_PROFILE_PATH="$app_profile_path" node -e 'require("node:fs").writeFileSync(process.env.IOS_APP_PROFILE_PATH, Buffer.from(process.env.IOS_APP_PROVISIONING_PROFILE, "base64"))'
          IOS_WIDGET_PROFILE_PATH="$widget_profile_path" node -e 'require("node:fs").writeFileSync(process.env.IOS_WIDGET_PROFILE_PATH, Buffer.from(process.env.IOS_WIDGET_PROVISIONING_PROFILE, "base64"))'
          APPLE_API_KEY_PATH="$api_key_path" node -e 'require("node:fs").writeFileSync(process.env.APPLE_API_KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_P8, "base64"))'
          chmod 600 "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          if [[ "$identities" != *"Apple Distribution:"* && "$identities" != *"iPhone Distribution:"* ]]; then
            echo "::error::The iOS certificate secret contains no Apple Distribution signing identity"
            exit 1
          fi

          install_profile() {
            local source_path="$1"
            local expected_bundle_id="$2"
            local plist_path="$3"
            security cms -D -i "$source_path" > "$plist_path"
            local profile_uuid profile_name profile_json installed_path
            profile_uuid="$(plutil -extract UUID raw -o - "$plist_path")"
            profile_name="$(plutil -extract Name raw -o - "$plist_path")"
            profile_json="$(plutil -convert json -o - "$plist_path")"
            PROFILE_JSON="$profile_json" EXPECTED_APPLICATION_IDENTIFIER="$APPLE_TEAM_ID.$expected_bundle_id" node -e '
              const profile = JSON.parse(process.env.PROFILE_JSON);
              const entitlements = profile.Entitlements || {};
              if (profile.TeamIdentifier?.[0] !== process.env.APPLE_TEAM_ID) throw new Error("Provisioning profile belongs to a different Apple team.");
              if (entitlements["application-identifier"] !== process.env.EXPECTED_APPLICATION_IDENTIFIER) throw new Error(`Provisioning profile does not match ${process.env.EXPECTED_APPLICATION_IDENTIFIER}.`);
              if (Object.hasOwn(profile, "ProvisionedDevices") || profile.ProvisionsAllDevices) throw new Error("Provisioning profile is not an App Store distribution profile.");
              if (entitlements["get-task-allow"] !== false) throw new Error("Provisioning profile allows debugging and is not an App Store profile.");
              if (!entitlements["com.apple.security.application-groups"]?.includes("group.com.taskhandoff.mobile")) throw new Error("Provisioning profile is missing group.com.taskhandoff.mobile.");
              if (process.env.EXPECTED_APPLICATION_IDENTIFIER.endsWith("com.taskhandoff.mobile") && entitlements["aps-environment"] !== "production") throw new Error("Main App provisioning profile is missing the production push entitlement.");
            '
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            installed_path="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
            cp "$source_path" "$installed_path"
            printf '%s\t%s\n' "$profile_name" "$installed_path"
          }

          IFS=$'\t' read -r app_profile_name installed_app_profile_path <<< "$(install_profile "$app_profile_path" com.taskhandoff.mobile "$RUNNER_TEMP/taskhandoff-app-profile.plist")"
          IFS=$'\t' read -r widget_profile_name installed_widget_profile_path <<< "$(install_profile "$widget_profile_path" com.taskhandoff.mobile.widgets "$RUNNER_TEMP/taskhandoff-widget-profile.plist")"
          {
            echo "keychain_path=$keychain_path"
            echo "api_key_path=$api_key_path"
            echo "app_profile_name=$app_profile_name"
            echo "widget_profile_name=$widget_profile_name"
            echo "installed_app_profile_path=$installed_app_profile_path"
            echo "installed_widget_profile_path=$installed_widget_profile_path"
          } >> "$GITHUB_OUTPUT"

      - name: Archive and export signed iOS application
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_PROFILE_NAME: ${{ steps.signing.outputs.app_profile_name }}
          WIDGET_PROFILE_NAME: ${{ steps.signing.outputs.widget_profile_name }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/TaskHandoff.xcarchive"
          export_path="$RUNNER_TEMP/TaskHandoff-iOS"
          export_options_path="$RUNNER_TEMP/TaskHandoff-ExportOptions.plist"
          build_number="$GITHUB_RUN_NUMBER"

          ruby <<'RUBY'
          require "xcodeproj"

          project = Xcodeproj::Project.open("ios/TaskHandoff.xcodeproj")
          profiles = {
            "TaskHandoff" => ENV.fetch("APP_PROFILE_NAME"),
            "ExpoWidgetsTarget" => ENV.fetch("WIDGET_PROFILE_NAME"),
          }

          profiles.each do |target_name, profile_name|
            target = project.targets.find { |candidate| candidate.name == target_name }
            abort("Missing expected Xcode target: #{target_name}") unless target

            configuration = target.build_configurations.find { |candidate| candidate.name == "Release" }
            abort("Missing Release configuration for Xcode target: #{target_name}") unless configuration

            configuration.build_settings.merge!(
              "CODE_SIGN_IDENTITY" => "Apple Distribution",
              "CODE_SIGN_STYLE" => "Manual",
              "DEVELOPMENT_TEAM" => ENV.fetch("APPLE_TEAM_ID"),
              "PROVISIONING_PROFILE_SPECIFIER" => profile_name,
            )
          end
          project.save
          RUBY

          xcodebuild archive \
            -workspace ios/TaskHandoff.xcworkspace \
            -scheme TaskHandoff \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$build_number" \
            MARKETING_VERSION="$RELEASE_VERSION"

          EXPORT_OPTIONS_PATH="$export_options_path" node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.env.EXPORT_OPTIONS_PATH, JSON.stringify({
              destination: "export",
              manageAppVersionAndBuildNumber: false,
              method: "app-store-connect",
              provisioningProfiles: {
                "com.taskhandoff.mobile": process.env.APP_PROFILE_NAME,
                "com.taskhandoff.mobile.widgets": process.env.WIDGET_PROFILE_NAME,
              },
              signingStyle: "manual",
              stripSwiftSymbols: true,
              teamID: process.env.APPLE_TEAM_ID,
              uploadSymbols: true,
            }));
          '
          plutil -convert xml1 "$export_options_path"
          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options_path"

          ipa_path="$(find "$export_path" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "::error::Xcode export produced no IPA"
            exit 1
          fi
          echo "IOS_IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Upload iOS application to App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}
        shell: bash
        run: |
          xcrun altool --validate-app "$IOS_IPA_PATH" \
            --api-key "$APPLE_API_KEY_ID" \
            --api-issuer "$APPLE_API_ISSUER"
          xcrun altool --upload-package "$IOS_IPA_PATH" \
            --api-key "$APPLE_API_KEY_ID" \
            --api-issuer "$APPLE_API_ISSUER" \
            --wait

      - name: Remove temporary iOS signing material
        if: always()
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/taskhandoff-ios-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" "$RUNNER_TEMP/taskhandoff-ios-distribution.p12" "$RUNNER_TEMP/taskhandoff-app.mobileprovision" "$RUNNER_TEMP/taskhandoff-widget.mobileprovision"
          for profile_path in "${{ steps.signing.outputs.installed_app_profile_path }}" "${{ steps.signing.outputs.installed_widget_profile_path }}"; do
            [[ -n "$profile_path" ]] && rm -f "$profile_path"
          done
