name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.95.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-node:
    name: Quality / Node tests (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore remote desktop build cache
        uses: actions/cache@v6
        with:
          path: |
            remote-desktop-rs/target
            ~/.cargo/registry
          key: remote-desktop-host-${{ runner.os }}-1.95.0-${{ hashFiles('remote-desktop-rs/Cargo.lock') }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Install Rust for remote desktop host tests
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install remote desktop host build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libxcb1-dev
      - name: Build remote desktop host test binary
        run: cargo build --manifest-path remote-desktop-rs/Cargo.toml -p desktop-streaming --bin task-handoff-desktop-streaming
      - name: Test Node packages (${{ matrix.shard }}/2)
        env:
          TASK_HANDOFF_TEST_SHARD: ${{ matrix.shard }}/2
        run: pnpm run test:node

  quality-client:
    name: Quality / Client and mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Test Control Plane client
        run: pnpm --filter @task-handoff/control-plane-client test
      - name: Test Control Plane UI
        run: pnpm --filter @task-handoff/control-plane-ui test
      - name: Test mobile
        run: pnpm --filter @task-handoff/mobile test

  quality-static:
    name: Quality / Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm web:typecheck
      - name: Check controlled instance Rust migration boundary
        run: node scripts/check-controlled-instance-rust-migration.mjs

  quality:
    needs: [quality-node, quality-client, quality-static]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all quality jobs succeeded
        env:
          NODE_RESULT: ${{ needs['quality-node'].result }}
          CLIENT_RESULT: ${{ needs['quality-client'].result }}
          STATIC_RESULT: ${{ needs['quality-static'].result }}
        run: |
          printf 'quality-node=%s quality-client=%s quality-static=%s\n' "$NODE_RESULT" "$CLIENT_RESULT" "$STATIC_RESULT"
          test "$NODE_RESULT" = success
          test "$CLIENT_RESULT" = success
          test "$STATIC_RESULT" = success

  rust-controlled-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.95 and Windows check target
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-gnu

      - name: Check formatting
        run: cargo fmt --manifest-path controlled-instance-rs/Cargo.toml --all -- --check

      - name: Test Rust workspace
        run: cargo test --manifest-path controlled-instance-rs/Cargo.toml --workspace

      - name: Install Windows C cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Check Windows target
        run: cargo check --manifest-path controlled-instance-rs/Cargo.toml --workspace --all-targets --target x86_64-pc-windows-gnu

      - name: Lint Rust workspace
        run: cargo clippy --manifest-path controlled-instance-rs/Cargo.toml --workspace --all-targets

  controlled-instance-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal

      - run: pnpm install --frozen-lockfile

      - name: Build Node controlled-instance baseline
        run: pnpm run build:controlled-instance

      - name: Build Rust controlled-instance
        run: cargo build --manifest-path controlled-instance-rs/Cargo.toml -p controlled-instance-cli

      - name: Compare Node and Rust controlled-instance HTTP behavior
        run: node scripts/controlled-instance-differential.mjs --out release/controlled-instance-rust-validation/ci-differential.json

  node-pty-prebuilds:
    name: node-pty prebuild (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and collect Linux node-pty prebuild on the glibc baseline
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            node:24-bullseye \
            bash -lc 'set -euo pipefail; cd node_modules/node-pty; rm -rf build; npm_config_nodedir=/usr/local node /usr/local/lib/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js rebuild; cd /workspace; node scripts/node-pty-prebuild.mjs build --output release/node-pty-prebuilds --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"'

      - uses: actions/upload-artifact@v7
        with:
          name: ci-node-pty-prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/node-pty-prebuilds/*
          if-no-files-found: error

  controlled-instance-rust-binaries:
    name: Rust controlled instance binary (linux-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore Rust release cache
        id: rust-release-cache
        uses: actions/cache@v6
        with:
          path: |
            controlled-instance-rs/target/linux-${{ matrix.arch }}
            ${{ runner.temp }}/cargo-home
          key: rust-release-${{ runner.os }}-${{ matrix.arch }}-1.95.0-${{ hashFiles('controlled-instance-rs/Cargo.lock') }}

      - name: Restore Rust source mtimes
        if: steps.rust-release-cache.outputs.cache-hit == 'true'
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3
        with:
          args: '--quiet controlled-instance-rs remote-desktop-rs'

      - name: Build on the glibc baseline
        shell: bash
        env:
          CARGO_HOME_CACHE: ${{ runner.temp }}/cargo-home
          RUST_TOOLCHAIN: ${{ matrix.arch == 'x64' && 'x86_64-unknown-linux-gnu' || 'aarch64-unknown-linux-gnu' }}
        run: |
          mkdir -p "$CARGO_HOME_CACHE"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -v "$CARGO_HOME_CACHE:/cargo-home" \
            -w /workspace/controlled-instance-rs \
            -e CARGO_HOME=/cargo-home \
            -e HOME=/cargo-home \
            -e CARGO_TARGET_DIR="target/linux-${{ matrix.arch }}" \
            -e RUST_TOOLCHAIN="$RUST_TOOLCHAIN" \
            rust:1.95-bookworm \
            bash -c '
              set -euo pipefail
              export PATH="/usr/local/rustup/toolchains/1.95.0-${RUST_TOOLCHAIN}/bin:${PATH}"
              cargo build --locked --release -p controlled-instance-cli
              install -d -m 0755 /workspace/release/rust-controlled-instance-binaries
              install -m 0755 "$CARGO_TARGET_DIR/release/controlled-instance-rs" \
                "/workspace/release/rust-controlled-instance-binaries/controlled-instance-linux-${{ matrix.arch }}"
            '

      - uses: actions/upload-artifact@v7
        with:
          name: ci-rust-controlled-instance-linux-${{ matrix.arch }}
          path: release/rust-controlled-instance-binaries/*
          if-no-files-found: error

  runtime-packages:
    needs: [node-pty-prebuilds, controlled-instance-rust-binaries]
    strategy:
      fail-fast: false
      matrix:
        implementation: [node, rust]
    env:
      TASK_HANDOFF_CONTROLLED_INSTANCE_IMPLEMENTATION: ${{ matrix.implementation }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v7
        with:
          pattern: ci-node-pty-prebuild-*
          path: release/node-pty-prebuilds
          merge-multiple: true

      - uses: actions/download-artifact@v7
        if: matrix.implementation == 'rust'
        with:
          pattern: ci-rust-controlled-instance-linux-*
          path: release/rust-controlled-instance-binaries
          merge-multiple: true

      - name: Build and verify selected Linux artifact
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          pnpm runtime:build -- --target controlled-instance
          pnpm runtime:artifact -- --version "$version" --prebuilds-dir release/node-pty-prebuilds
          node -e 'import("./scripts/controlled-instance-artifact-check.mjs").then(async ({ checkControlledInstanceArtifact }) => console.log(JSON.stringify(await checkControlledInstanceArtifact("release/runtime-artifacts"))))'

      - name: Build and pack selected runtime package
        run: pnpm runtime:pack:controlled-instance

      - name: Verify selected controlled instance artifact
        run: node -e 'import("./scripts/controlled-instance-artifact-check.mjs").then(async ({ checkControlledInstanceArtifact }) => console.log(JSON.stringify(await checkControlledInstanceArtifact("release/runtime-artifacts"))))'
