name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.89.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Test Node packages
        run: pnpm run test:node
      - name: Test Control Plane client
        run: pnpm --filter @task-handoff/control-plane-client test
      - name: Test Control Plane UI
        run: pnpm --filter @task-handoff/control-plane-ui test
      - name: Test mobile
        run: pnpm --filter @task-handoff/mobile test
      - run: pnpm check
      - run: pnpm web:typecheck
      - name: Check controlled instance Rust migration boundary
        run: node scripts/check-controlled-instance-rust-migration.mjs

  rust-controlled-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.89 and Windows check target
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-gnu

      - name: Check formatting
        run: cargo fmt --manifest-path controlled-instance-rs/Cargo.toml --all -- --check

      - name: Test Rust workspace
        run: cargo test --manifest-path controlled-instance-rs/Cargo.toml --workspace

      - name: Install Windows C cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64

      - name: Check Windows target
        run: cargo check --manifest-path controlled-instance-rs/Cargo.toml --workspace --all-targets --target x86_64-pc-windows-gnu

      - name: Lint Rust workspace
        run: cargo clippy --manifest-path controlled-instance-rs/Cargo.toml --workspace --all-targets

  controlled-instance-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal

      - run: pnpm install --frozen-lockfile

      - name: Build Node controlled-instance baseline
        run: pnpm run build:controlled-instance

      - name: Build Rust controlled-instance
        run: cargo build --manifest-path controlled-instance-rs/Cargo.toml -p controlled-instance-cli

      - name: Compare Node and Rust controlled-instance HTTP behavior
        run: node scripts/controlled-instance-differential.mjs --out release/controlled-instance-rust-validation/ci-differential.json

  node-pty-prebuilds:
    name: node-pty prebuild (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and collect Linux node-pty prebuild on the glibc baseline
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            node:24-bullseye \
            bash -lc 'set -euo pipefail; cd node_modules/node-pty; rm -rf build; npm_config_nodedir=/usr/local node /usr/local/lib/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js rebuild; cd /workspace; node scripts/node-pty-prebuild.mjs build --output release/node-pty-prebuilds --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"'

      - uses: actions/upload-artifact@v7
        with:
          name: ci-node-pty-prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/node-pty-prebuilds/*
          if-no-files-found: error

  controlled-instance-rust-binaries:
    name: Rust controlled instance binary (linux-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build on the glibc baseline
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{ matrix.arch == 'x64' && 'x86_64-unknown-linux-gnu' || 'aarch64-unknown-linux-gnu' }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/controlled-instance-rs \
            -e CARGO_TARGET_DIR="target/linux-${{ matrix.arch }}" \
            -e RUST_TOOLCHAIN="$RUST_TOOLCHAIN" \
            rust:1.89-bookworm \
            bash -c '
              set -euo pipefail
              export PATH="/usr/local/rustup/toolchains/1.89.0-${RUST_TOOLCHAIN}/bin:${PATH}"
              cargo build --locked --release -p controlled-instance-cli
              install -d -m 0755 /workspace/release/rust-controlled-instance-binaries
              install -m 0755 "$CARGO_TARGET_DIR/release/controlled-instance-rs" \
                "/workspace/release/rust-controlled-instance-binaries/controlled-instance-linux-${{ matrix.arch }}"
            '

      - uses: actions/upload-artifact@v7
        with:
          name: ci-rust-controlled-instance-linux-${{ matrix.arch }}
          path: release/rust-controlled-instance-binaries/*
          if-no-files-found: error

  runtime-packages:
    needs: [node-pty-prebuilds, controlled-instance-rust-binaries]
    strategy:
      fail-fast: false
      matrix:
        implementation: [node, rust]
    env:
      TASK_HANDOFF_CONTROLLED_INSTANCE_IMPLEMENTATION: ${{ matrix.implementation }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v7
        with:
          pattern: ci-node-pty-prebuild-*
          path: release/node-pty-prebuilds
          merge-multiple: true

      - uses: actions/download-artifact@v7
        if: matrix.implementation == 'rust'
        with:
          pattern: ci-rust-controlled-instance-linux-*
          path: release/rust-controlled-instance-binaries
          merge-multiple: true

      - name: Build and verify selected Linux artifact
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          pnpm runtime:build -- --target controlled-instance
          pnpm runtime:artifact -- --version "$version" --prebuilds-dir release/node-pty-prebuilds
          node -e 'import("./scripts/controlled-instance-artifact-check.mjs").then(async ({ checkControlledInstanceArtifact }) => console.log(JSON.stringify(await checkControlledInstanceArtifact("release/runtime-artifacts"))))'

      - name: Build and pack selected runtime packages
        run: pnpm runtime:pack

      - name: Verify selected controlled instance artifact
        run: node -e 'import("./scripts/controlled-instance-artifact-check.mjs").then(async ({ checkControlledInstanceArtifact }) => console.log(JSON.stringify(await checkControlledInstanceArtifact("release/runtime-artifacts"))))'
