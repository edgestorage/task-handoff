services:
  task-handoff-web:
    build:
      context: .
      args:
        CODEX_CLI_PACKAGE: ${CODEX_CLI_PACKAGE:-@openai/codex@latest}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.183}
        TASK_HANDOFF_ENABLE_CC_SWITCH: ${TASK_HANDOFF_ENABLE_CC_SWITCH:-0}
        CC_SWITCH_VERSION: ${CC_SWITCH_VERSION:-3.16.3}
        CC_SWITCH_DEB_URL: ${CC_SWITCH_DEB_URL:-}
        CC_SWITCH_COMMAND: ${CC_SWITCH_COMMAND:-cc-switch}
        CHROMIUM_EXTENSION_URLS: ${CHROMIUM_EXTENSION_URLS:-}
        CHROMIUM_EXTENSION_IDS: ${CHROMIUM_EXTENSION_IDS:-}
        CHROMIUM_EXTENSION_UPDATE_URL: ${CHROMIUM_EXTENSION_UPDATE_URL:-https://clients2.google.com/service/update2/crx}
        TASK_HANDOFF_ENABLE_WEB_CAP: ${TASK_HANDOFF_ENABLE_WEB_CAP:-0}
        WEB_CAPABILITY_VERSION: ${WEB_CAPABILITY_VERSION:-0.0.7}
        WEB_CAP_EXTENSION_VERSION: ${WEB_CAP_EXTENSION_VERSION:-0.0.7}
        WEB_CAP_EXTENSION_URL: ${WEB_CAP_EXTENSION_URL:-}
        WEB_CAP_SKILL_REPOSITORY: ${WEB_CAP_SKILL_REPOSITORY:-https://github.com/edgestorage/web-cap.git}
        WEB_CAP_SKILL_REF: ${WEB_CAP_SKILL_REF:-v0.0.7}
    image: task-handoff-web:local
    shm_size: "1gb"
    security_opt:
      - seccomp=unconfined
    ports:
      - "${TASK_HANDOFF_WEB_PORT:-8080}:8080"
    environment:
      TASK_HANDOFF_WEB_HOST: 0.0.0.0
      TASK_HANDOFF_WEB_PORT: 8080
      TASK_HANDOFF_WEB_AUTH: ${TASK_HANDOFF_WEB_AUTH:-off}
      TASK_HANDOFF_WEB_TOKEN: ${TASK_HANDOFF_WEB_TOKEN:-}
      TASK_HANDOFF_APP_SESSION_PERSIST: ${TASK_HANDOFF_APP_SESSION_PERSIST:-0}
      TASK_HANDOFF_APP_SESSION_RETENTION_DAYS: ${TASK_HANDOFF_APP_SESSION_RETENTION_DAYS:-}
      TASK_HANDOFF_CHROMIUM_NO_SANDBOX: ${TASK_HANDOFF_CHROMIUM_NO_SANDBOX:-0}
      TASK_HANDOFF_ENABLE_CC_SWITCH: ${TASK_HANDOFF_ENABLE_CC_SWITCH:-0}
      TASK_HANDOFF_CC_SWITCH_COMMAND: ${CC_SWITCH_COMMAND:-cc-switch}
      WEB_CAP_DAEMON_IDLE_TIMEOUT_MS: ${WEB_CAP_DAEMON_IDLE_TIMEOUT_MS:-0}
    volumes:
      - ${TASK_HANDOFF_WORKSPACE_HOST:-.}:/workspace
      - task-handoff-data:/data
      - task-handoff-agent-home:/home/agent
    healthcheck:
      test: ["CMD", "task-handoff-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  task-handoff-data:
  task-handoff-agent-home:
